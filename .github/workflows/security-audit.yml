name: Security Audit
on:
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml

      - name: Server Audit
        run: |
          cd server
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
      - name: Client Audit
        run: |
          cd client
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This catches if anyone commits .env files or API keys
      - name: gitleaks-action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static analysis catches common auth vulnerabilities like JWT algorithm confusion
      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep ci --config=p/jwt --config=p/nodejs

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Server Docker image
        run: docker build -t server:local ./server
      - name: Build Client Docker image
        run: docker build -t client:local ./client
      - name: Run Trivy vulnerability scanner (Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'server:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Run Trivy vulnerability scanner (Client)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'client:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
